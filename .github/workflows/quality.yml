name: Quality gates

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate catalog, exports, design and isolated unit tests
        run: npm run check
      - name: Verify referenced static files
        shell: bash
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f src/catalog.mjs
          test -f data/drafts.json
          test -f assets/readme-banner.svg
