name: Browser smoke and evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned test-only browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/draft-studio-server.log 2>&1 &
          echo $! > /tmp/draft-studio-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/; then exit 0; fi
            sleep 1
          done
          cat /tmp/draft-studio-server.log
          exit 1
      - name: Desktop and mobile Chromium checks
        run: node test/browser-smoke.mjs
      - name: Upload real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-browser-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
